audit-migration-safety:
  description: Audit SQL migration file(s) for operational safety
  target_agent: migration-safety-auditor
  model_class: standard
  allowed_from_agents:
    - migration-safety-auditor
  workflow: migration-audit
  input_artifacts:
    - migration-sql-input
    - cli-contract-source
    - lint-rules-source
    - schema-sql-context
  invocation_handoff: migration-audit-request
  result_handoff: migration-audit-result
  responsibilities:
    - Evaluate all SQL statements for operational risks
    - Classify findings by severity and category
    - Determine expand/contract necessity
    - Note deployment ordering if relevant
  completion_criteria:
    - All SQL statements in the target file(s) have been evaluated
    - Findings classified by severity and category
    - Expand/contract necessity explicitly determined
    - Deployment notes included if app/infra ordering is relevant
    - Output conforms to AgentAuditResult schema

propose-expand-contract:
  description: Generate expand/contract migration group proposal from unsafe DDL
  target_agent: migration-safety-auditor
  model_class: thinking
  allowed_from_agents:
    - migration-safety-auditor
  workflow: expand-contract-proposal
  input_artifacts:
    - migration-sql-input
    - documentation
  invocation_handoff: migration-audit-request
  result_handoff: expand-contract-proposal-result
  responsibilities:
    - Identify unsafe DDL that requires phased rollout
    - Decompose into expand/backfill/switch/contract phases
    - Provide valid SQL for each phase with appropriate guards
    - Specify deployment gates between phases
  completion_criteria:
    - Each phase has valid SQL with IF NOT EXISTS or appropriate guards
    - Deployment gates between phases are specified
    - Original unsafe operation decomposed into safe steps
    - recommendedActions include edit_file actions for each phase file

explain-command-result:
  description: Explain migraguard command output in human-readable form
  target_agent: migration-safety-auditor
  model_class: fast
  allowed_from_agents:
    - migration-safety-auditor
  workflow: command-explanation
  input_artifacts:
    - command-output-json
    - cli-contract-source
  invocation_handoff: migration-audit-request
  result_handoff: explain-result
  responsibilities:
    - Summarize command output for non-DBA readers
    - Provide concrete next steps as recommendedActions
    - Explain technical concepts in plain language
  completion_criteria:
    - Explanation accurately summarizes the command output
    - Action items are concrete and actionable
    - Technical terms explained for non-DBA readers
    - Severity reflects urgency of the underlying issue

implement-migration:
  description: Generate production-safe migration SQL from natural language description
  target_agent: migration-implementer
  model_class: thinking
  allowed_from_agents:
    - migration-implementer
  workflow: migration-implementation
  input_artifacts:
    - documentation
    - lint-rules-source
    - schema-sql-context
  invocation_handoff: migration-audit-request
  result_handoff: implement-migration-result
  responsibilities:
    - Generate valid PostgreSQL migration SQL applying all safe DDL patterns
    - Ensure generated SQL would pass all applicable migraguard lint rules
    - Produce correctly named migration files (YYYYMMDD_HHMMSS__description.sql)
    - Predict lint rule violations as findings (should be empty for correct SQL)
    - Propose expand/contract group structure when phased rollout is required
    - Output lint → apply → dump workflow steps as recommendedActions
  completion_criteria:
    - migrations array contains at least one entry with fileName, sql, and description
    - All generated SQL uses safe DDL patterns (CONCURRENTLY, lock_timeout, IF NOT EXISTS, ANALYZE)
    - FK/CHECK constraints use NOT VALID with VALIDATE in a separate migration file
    - recommendedActions include run_command entries for lint, apply, and dump
    - Output conforms to ImplementMigrationResult schema

audit-workflow-compliance:
  description: Audit project migration workflow compliance
  target_agent: workflow-auditor
  model_class: standard
  allowed_from_agents:
    - workflow-auditor
  workflow: workflow-audit
  input_artifacts:
    - migration-sql-input
    - schema-sql-context
    - metadata-source
    - lint-rules-source
  invocation_handoff: migration-audit-request
  result_handoff: workflow-audit-result
  responsibilities:
    - Check all provided migration files for unsafe DDL patterns
    - Verify schema.sql is machine-generated by migraguard dump
    - Validate metadata.json consistency against migration file list
    - Check expand/contract group phase transition validity
    - Assess adherence to the lint → apply → dump workflow
  completion_criteria:
    - All migration files evaluated for safe DDL pattern compliance
    - schema.sql machine-generation status determined
    - metadata.json integrity verified
    - Workflow adherence assessed and findings classified by severity
    - Output conforms to AgentAuditResult schema
