explain-result:
  version: 1
  description: >-
    Result of explain-command-result task.
    Schema mirrors cli-contract.yaml#/components/schemas/ExplainResult.
  schema:
    type: object
    properties:
      summary:
        type: string
      riskLevel:
        type: string
        enum: [low, medium, high, critical]
      explanation:
        type: string
        description: Multi-paragraph human-readable explanation in Markdown format.
      findings:
        type: array
        items:
          type: object
          properties:
            severity:
              type: string
              enum: [info, warning, error, critical]
            category:
              type: string
            message:
              type: string
          required: [severity, category, message]
      recommendedActions:
        type: array
        items:
          type: object
          properties:
            kind:
              type: string
              enum: [run_command, edit_file, review, confirm, block, ignore]
            title:
              type: string
            rationale:
              type: string
          required: [kind, title]
      sourceCommand:
        type: string
        description: The command that produced the input (e.g. "migraguard lint").
      metadata:
        type: object
        properties:
          tool:
            type: string
          command:
            type: string
          version:
            type: string
          generatedAt:
            type: string
          adapter:
            type: string
          model:
            type: string
    required:
      - summary
      - riskLevel
      - explanation
