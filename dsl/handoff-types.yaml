migration-audit-request:
  version: 1
  description: Request to execute a migration-related LLM task
  schema:
    type: object
    properties:
      task_id:
        type: string
        description: Identifier of the task to execute (audit-migration-safety, propose-expand-contract, explain-command-result)
      context:
        type: string
        description: Built context string from migration files, lint results, config, and schema
    required:
      - task_id
      - context

migration-audit-result:
  version: 1
  description: >-
    Result of a migration safety audit task.
    Schema mirrors cli-contract.yaml#/components/schemas/MigrationAuditResult.
  schema:
    type: object
    properties:
      summary:
        type: string
      riskLevel:
        type: string
        enum: [low, medium, high, critical]
      findings:
        type: array
        items:
          type: object
          properties:
            id:
              type: string
            severity:
              type: string
              enum: [info, warning, error, critical]
            category:
              type: string
            target:
              type: string
            location:
              type: string
            message:
              type: string
            recommendation:
              type: string
            confidence:
              type: number
              minimum: 0
              maximum: 1
            evidence:
              type: array
              items:
                type: object
                properties:
                  type:
                    type: string
                    description: Evidence type identifier
                  content:
                    type: string
                    description: Evidence content or excerpt
                  source:
                    type: string
                    description: Source of the evidence (file path, command, etc.)
                  kind:
                    type: string
                    enum: [file, command, schema, diff, stdout, stderr, text]
                    description: Migration-specific evidence kind (extends base AgentEvidence)
                  location:
                    type: string
                    description: Location within the source
            details:
              type: object
              additionalProperties: true
          required: [severity, category, message]
      recommendedActions:
        type: array
        items:
          type: object
          properties:
            kind:
              type: string
              enum: [run_command, edit_file, review, confirm, block, ignore]
            title:
              type: string
            command:
              type: string
            target:
              type: string
            rationale:
              type: string
          required: [kind, title]
      metadata:
        type: object
        properties:
          tool:
            type: string
          command:
            type: string
          version:
            type: string
          generatedAt:
            type: string
          adapter:
            type: string
          model:
            type: string
    required:
      - summary
      - riskLevel
      - findings

expand-contract-proposal-result:
  version: 1
  description: >-
    Result of propose-expand-contract task.
    Schema mirrors cli-contract.yaml#/components/schemas/ExpandContractProposal.
  schema:
    type: object
    properties:
      summary:
        type: string
      riskLevel:
        type: string
        enum: [low, medium, high, critical]
      findings:
        type: array
        items:
          type: object
          properties:
            id:
              type: string
            severity:
              type: string
              enum: [info, warning, error, critical]
            category:
              type: string
            message:
              type: string
            recommendation:
              type: string
          required: [severity, category, message]
      phases:
        type: array
        items:
          type: object
          properties:
            name:
              type: string
              enum: [expand, backfill, switch, contract]
            sql:
              type: string
            description:
              type: string
            deploymentGate:
              type: string
          required: [name, sql, description]
      recommendedActions:
        type: array
        items:
          type: object
          properties:
            kind:
              type: string
              enum: [run_command, edit_file, review, confirm, block, ignore]
            title:
              type: string
            command:
              type: string
            target:
              type: string
            rationale:
              type: string
          required: [kind, title]
      metadata:
        type: object
        properties:
          tool:
            type: string
          command:
            type: string
          version:
            type: string
          generatedAt:
            type: string
          adapter:
            type: string
          model:
            type: string
    required:
      - summary
      - riskLevel
      - findings
      - phases

implement-migration-result:
  version: 1
  description: >-
    Result of implement-migration task.
    Extends AgentAuditResult with a migrations array.
    # SSoT: cli-contract.yaml#/components/schemas/ImplementMigrationResult
  schema:
    type: object
    properties:
      summary:
        type: string
      riskLevel:
        type: string
        enum: [low, medium, high, critical]
      findings:
        type: array
        items:
          type: object
          properties:
            id:
              type: string
            severity:
              type: string
              enum: [info, warning, error, critical]
            category:
              type: string
            target:
              type: string
            location:
              type: string
            message:
              type: string
            recommendation:
              type: string
            confidence:
              type: number
              minimum: 0
              maximum: 1
          required: [severity, category, message]
      migrations:
        type: array
        description: Generated migration files
        items:
          type: object
          properties:
            fileName:
              type: string
              description: File name following YYYYMMDD_HHMMSS__description.sql convention
            sql:
              type: string
              description: Full SQL content of the migration file
            description:
              type: string
              description: Human-readable description of what this migration does
            phase:
              type: string
              enum: [expand, backfill, switch, contract]
              description: Expand/contract phase (only set when part of a group)
          required: [fileName, sql, description]
      recommendedActions:
        type: array
        items:
          type: object
          properties:
            kind:
              type: string
              enum: [run_command, edit_file, review, confirm, block, ignore]
            title:
              type: string
            command:
              type: string
            target:
              type: string
            rationale:
              type: string
          required: [kind, title]
      metadata:
        type: object
        properties:
          tool:
            type: string
          command:
            type: string
          version:
            type: string
          generatedAt:
            type: string
          adapter:
            type: string
          model:
            type: string
    required:
      - summary
      - riskLevel
      - findings
      - migrations

