version: 0.1.0

input:
  files:
    - cli-contract.yaml

generators:
  markdown:
    enabled: true
    output: ./docs/cli-reference.md
    templates: builtin:markdown
    options:
      includeSchemas: true
      includeExtensions: true

  typescript:
    enabled: true
    output: ./src/generated
    templates: builtin:typescript
    options:
      emitProgram: true
      emitTypes: true
      emitValidators: true

executionProfiles:
  local:
    default: true
    commandSets:
      migraguard:
        command: npx migraguard
