services:
  test-unit:
    build:
      context: ..
      dockerfile: migraguard/Dockerfile.test
      args:
        NODE_VERSION: ${NODE_VERSION:-22}
        GITHUB_TOKEN: ${GITHUB_TOKEN:-}
    volumes:
      - ./src:/app/migraguard/src:ro
      - ./tests:/app/migraguard/tests:ro
      - ./__tests__:/app/migraguard/__tests__:ro
    network_mode: none
    command: ["npm", "run", "test:unit"]

  test-integration:
    build:
      context: ..
      dockerfile: migraguard/Dockerfile.test
      args:
        NODE_VERSION: ${NODE_VERSION:-22}
        GITHUB_TOKEN: ${GITHUB_TOKEN:-}
    volumes:
      - ./src:/app/migraguard/src:ro
      - ./tests:/app/migraguard/tests:ro
      - ./__tests__:/app/migraguard/__tests__:ro
    environment:
      DATABASE_URL: postgres://migraguard_test:migraguard_test@postgres:5432/migraguard_test
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - test-internal
    command: ["npm", "run", "test:integration"]

  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: migraguard_test
      POSTGRES_PASSWORD: migraguard_test
      POSTGRES_DB: migraguard_test
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U migraguard_test"]
      interval: 2s
      timeout: 5s
      retries: 10
    networks:
      - test-internal

networks:
  test-internal:
    internal: true
