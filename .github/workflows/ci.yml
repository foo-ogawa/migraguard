name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Security audit
        run: docker run --rm -v "$(pwd)":/app:ro -w /app node:22-alpine npm audit --audit-level=critical

  build-and-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: foo-log-inc/agent-contracts-analyzer
          ref: v0.1.1
          path: agent-contracts-analyzer
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Build agent-contracts-analyzer
        working-directory: agent-contracts-analyzer
        run: npm ci --legacy-peer-deps && npm run build
      - name: Build test container
        run: docker compose -f docker-compose.test.yml build --build-arg NODE_VERSION=${{ matrix.node-version }}
      - name: Run unit tests
        run: docker compose -f docker-compose.test.yml run --rm test-unit
