name: CI

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install
        run: npm ci --legacy-peer-deps --ignore-scripts
      - name: Audit (production dependencies)
        # Blocking audit scoped to what a consumer installs: an advisory in a runtime
        # dependency reaches every user of the published package.
        run: npm audit --omit=dev --audit-level=moderate
      - name: Audit including dev dependencies (report only)
        # Non-blocking visibility for the dev toolchain, which runs only in CI and on a
        # developer's machine. Fix these when an upstream release makes it possible.
        continue-on-error: true
        run: npm audit --audit-level=moderate
      - name: Verify npm signatures
        # `audit:signatures` runs `npm audit signatures` with the npm version package.json pins, here and
        # in npm-audit-remediate.yml / release.yml. The npm 10 bundled with Node 20 / 22 fails a package
        # whose attestations response carries only the keyless provenance bundle (EMISSINGSIGNATUREKEY);
        # npm 11 requires a registry key only for a keyed (publish) attestation.
        run: npm run audit:signatures
      - name: Lint
        run: npm run lint --if-present
      - name: Verify generated artifacts match the CLI contract
        run: |
          npm run contract:generate
          git diff --exit-code -- src/generated docs/cli-reference.md
      - name: Verify generated artifacts match the agent DSL
        run: npm run dsl:generate -- --check
      - name: Typecheck
        run: npm run typecheck
      - name: Verify contract version matches the package version
        run: npx cli-contracts version-sync --check
      - name: Build
        run: npm run build
      - name: Docker unit tests (Node 24)
        run: |
          docker compose -f docker-compose.test.yml build --build-arg NODE_VERSION=24 test-unit
          docker compose -f docker-compose.test.yml run --rm test-unit
      - name: Docker unit tests (Node 22)
        run: |
          docker compose -f docker-compose.test.yml build --build-arg NODE_VERSION=22 test-unit
          docker compose -f docker-compose.test.yml run --rm test-unit
      - name: Bundle tests
        run: |
          node esbuild.bundle.mjs
          npx vitest run --config vitest.bundle.config.ts
      - name: Verify package contents
        run: npm pack --dry-run
