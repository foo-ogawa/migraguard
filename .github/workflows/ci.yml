name: CI

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install
        run: npm ci --legacy-peer-deps --ignore-scripts
      - name: Audit
        run: npm audit --audit-level=moderate
      - name: Verify npm signatures
        run: npm audit signatures
      - name: Lint
        run: npm run lint --if-present
      - name: Verify generated artifacts match the CLI contract
        run: |
          npm run contract:generate
          git diff --exit-code -- src/generated docs/cli-reference.md
      - name: Verify generated artifacts match the agent DSL
        run: npm run dsl:generate -- --check
      - name: Typecheck
        run: npm run typecheck
      - name: Build
        run: npm run build
      - name: Docker unit tests (Node 20)
        run: |
          docker compose -f docker-compose.test.yml build --build-arg NODE_VERSION=20 test-unit
          docker compose -f docker-compose.test.yml run --rm test-unit
      - name: Docker unit tests (Node 22)
        run: |
          docker compose -f docker-compose.test.yml build --build-arg NODE_VERSION=22 test-unit
          docker compose -f docker-compose.test.yml run --rm test-unit
      - name: Bundle tests
        run: |
          node esbuild.bundle.mjs
          npx vitest run --config vitest.bundle.config.ts
      - name: Verify package contents
        run: npm pack --dry-run
