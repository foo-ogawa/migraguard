# yaml-language-server: $schema=./node_modules/cli-contracts/schemas/cli-contract.schema.json
cliContracts: 0.1.0

info:
  title: migraguard CLI
  version: 0.8.4
  description: >-
    PostgreSQL-first schema-aware deployment control — idempotent SQL migrations
    with CI-enforced integrity checks, expand/contract migration orchestration,
    schema drift detection, and unified gating across database, application,
    and infrastructure rollouts. MySQL and SQLite supported as secondary dialects.
  license:
    name: MIT

commandSets:
  migraguard:
    summary: Schema-aware deployment control for SQL migrations.
    executable: migraguard

    globalOptions:
      - name: version
        aliases: [V]
        description: Print version and exit.
        schema:
          type: boolean

      - name: help
        aliases: [h]
        description: Show help and exit.
        schema:
          type: boolean

      - name: no-color
        description: Disable ANSI color output. Also respects NO_COLOR env var.
        schema:
          type: boolean
          default: false

      - name: quiet
        aliases: [q]
        description: Suppress informational output. Does not suppress structured stdout or error messages.
        schema:
          type: boolean
          default: false

      - name: config
        aliases: [c]
        description: Path to migraguard configuration file.
        valueName: path
        schema:
          type: string

    commands:
      # ── new ──────────────────────────────────────────
      new:
        summary: Create a new migration SQL file with UTC timestamp.
        description: >-
          Generates a timestamped SQL migration file in the configured migrations
          directory. With --expand-contract, creates a migration group directory
          containing phased files (expand, backfill, switch, contract).
        usage:
          - migraguard new create_users_table
          - migraguard new --expand-contract rename_username_to_handle

        arguments:
          - name: name
            index: 0
            required: true
            description: Migration name (alphanumeric and underscores).
            schema:
              type: string

        options:
          - name: expand-contract
            description: Create an expand/contract migration group (Class B).
            schema:
              type: boolean
              default: false

          - name: dry-run
            aliases: [n]
            description: Show what would be created without writing files.
            schema:
              type: boolean
              default: false

        exits:
          '0':
            description: Migration file (or group directory) created successfully (or dry-run preview completed).
            stdout:
              format: text
            files:
              - path: db/migrations/{timestamp}__{name}.sql
                required: false
                mediaType: application/sql
                encoding: utf-8
                description: Single migration file (Class A). Created when --expand-contract is not set.
              - path: db/migrations/{timestamp}__{name}/1_expand.sql
                required: false
                mediaType: application/sql
                encoding: utf-8
                description: Expand phase file (Class B, with --expand-contract).

          '1':
            description: Creation failed (config error or naming conflict).
            stderr:
              format: text

        x-agent:
          riskLevel: low
          requiresConfirmation: false
          idempotent: false
          sideEffects:
            - file_write
          sideEffectNote: Creates migration SQL file(s) in the configured migrations directory.
          safeDryRunOption: dry-run
          expectedDurationMs: 1000
          retryableExitCodes: []

      # ── apply ────────────────────────────────────────
      apply:
        summary: Apply pending migrations via native database CLI.
        description: >-
          Executes pending migrations using the database's native CLI
          (psql, mysql, or sqlite3). Uses advisory locks to prevent
          concurrent execution. Records each application attempt in
          the schema_migrations table.
        usage:
          - migraguard apply
          - migraguard apply --with-drift-check
          - migraguard apply --from-baseline
          - migraguard apply --dry-run

        options:
          - name: with-drift-check
            description: Check schema drift before apply and update dump after.
            schema:
              type: boolean
              default: false

          - name: from-baseline
            description: Apply schema.sql first, then remaining migrations.
            schema:
              type: boolean
              default: false

          - name: tag
            description: Tag to record with applied migrations (e.g. commit hash, release tag).
            schema:
              type: string

          - name: dry-run
            aliases: [n]
            description: List pending migrations and SQL that would be executed without applying.
            schema:
              type: boolean
              default: false

        exits:
          '0':
            description: All pending migrations applied successfully (or dry-run preview completed).
            stdout:
              format: text

          '1':
            description: >-
              Apply failed (migration error, drift detected, regression
              detected, or advisory lock conflict).
            stderr:
              format: text

        x-agent:
          riskLevel: high
          requiresConfirmation: true
          idempotent: false
          reversible: false
          rollbackGuidance: >-
            Migrations are not automatically reversible. Manual rollback
            requires writing a compensating migration or restoring from backup.
          sideEffects:
            - database_write
          sideEffectNote: >-
            Executes SQL via native CLI and records results in schema_migrations.
            Uses advisory lock to prevent concurrent execution.
          safeDryRunOption: dry-run
          expectedDurationMs: 60000
          retryableExitCodes: []
          recommendedBeforeUse:
            - Run migraguard check to verify metadata integrity.
            - Run migraguard lint to check for unsafe DDL patterns.
            - Consider running with --with-drift-check for local development.

      # ── check ────────────────────────────────────────
      check:
        summary: Verify metadata integrity (no DB connection required).
        description: >-
          Validates file list and checksums in metadata.json against the
          actual migration files on disk. Detects tampered, missing, or
          extra files. Runs offline without a database connection, making
          it suitable for CI/CD PR checks.
        usage:
          - migraguard check

        exits:
          '0':
            description: Metadata integrity verified. All checksums match.
            stdout:
              format: text

          '1':
            description: Unexpected error (file read failure, parse error).
            stderr:
              format: text

          '10':
            description: Integrity check failed (tampered, missing, or extra files).
            stderr:
              format: text

        x-agent:
          riskLevel: low
          requiresConfirmation: false
          idempotent: true
          sideEffects: []
          sideEffectNote: Read-only. Compares metadata.json against files on disk.
          expectedDurationMs: 2000
          retryableExitCodes: []

      # ── squash ───────────────────────────────────────
      squash:
        summary: Squash multiple new migration files into one.
        description: >-
          Merges pending (unapplied) migration files into a single file
          for release. Ensures one release = one file, simplifying error
          recovery and hotfix workflows. Original migration files are deleted.
        usage:
          - migraguard squash
          - migraguard squash --dry-run

        options:
          - name: dry-run
            aliases: [n]
            description: Show what would be squashed without writing files.
            schema:
              type: boolean
              default: false

        exits:
          '0':
            description: Migration files squashed successfully.
            stdout:
              format: text
            files:
              - path: db/migrations/{timestamp}__{description}.sql
                required: true
                mediaType: application/sql
                encoding: utf-8
                description: Squashed migration file.

          '1':
            description: Squash failed (nothing to squash or conflict).
            stderr:
              format: text

        x-agent:
          riskLevel: medium
          requiresConfirmation: true
          idempotent: false
          reversible: false
          rollbackGuidance: >-
            Deleted files can be recovered from version control (git checkout).
            Re-run migraguard new to recreate individual files if needed.
          sideEffects:
            - file_write
            - file_delete
          sideEffectNote: >-
            Merges migration files into one and deletes originals.
            Updates metadata.json.
          safeDryRunOption: dry-run
          expectedDurationMs: 3000
          retryableExitCodes: []
          recommendedBeforeUse:
            - Ensure all pending files are ready for release.
            - Confirm no uncommitted changes to migration files.

      # ── lint ─────────────────────────────────────────
      lint:
        summary: Run built-in safety rules on migration files.
        description: >-
          Performs AST-based lint analysis on migration SQL files using
          libpg-query (38 rules for PostgreSQL) or node-sql-parser
          (17 generic rules for MySQL/SQLite). Detects unsafe DDL patterns
          such as missing IF NOT EXISTS, non-concurrent index creation,
          missing lock timeouts, and prohibited operations.
        usage:
          - migraguard lint
          - migraguard lint --format json
          - migraguard lint --format json | migraguard explain

        options:
          - name: format
            description: Output format for lint results.
            valueName: fmt
            schema:
              type: string
              enum: [text, json]
              default: text

        exits:
          '0':
            description: All lint rules passed.
            stdout:
              format: '{options.format}'

          '10':
            description: Lint violations found.
            stdout:
              format: '{options.format}'
            stderr:
              format: text

          '1':
            description: Unexpected error (e.g. file parse failure).
            stderr:
              format: text

        x-agent:
          riskLevel: low
          requiresConfirmation: false
          idempotent: true
          sideEffects: []
          sideEffectNote: Read-only. Scans migration files against safety rules.
          expectedDurationMs: 3000
          retryableExitCodes: []

      # ── dump ─────────────────────────────────────────
      dump:
        summary: Dump and normalize current DB schema.
        description: >-
          Executes pg_dump (PostgreSQL), mysqldump (MySQL), or sqlite3 .schema
          (SQLite) to capture the current database schema, then normalizes the
          output and saves it to schema.sql.
        usage:
          - migraguard dump

        exits:
          '0':
            description: Schema dump saved successfully.
            stdout:
              format: text
            files:
              - path: db/schema.sql
                required: true
                mediaType: application/sql
                encoding: utf-8
                description: Normalized schema dump.

          '1':
            description: Dump failed (connection error or CLI not found).
            stderr:
              format: text

        x-agent:
          riskLevel: low
          requiresConfirmation: false
          idempotent: true
          sideEffects:
            - database_read
            - file_write
          sideEffectNote: >-
            Reads DB schema via pg_dump/mysqldump and writes normalized
            output to schema.sql.
          expectedDurationMs: 10000
          retryableExitCodes: [1]

      # ── diff ─────────────────────────────────────────
      diff:
        summary: Show diff between current DB schema and saved schema.sql.
        description: >-
          Dumps the current database schema, normalizes it, and compares
          it against the saved schema.sql file. Exits with code 10 if
          differences are found, enabling CI gating for schema drift.
        usage:
          - migraguard diff
          - migraguard diff --format json
          - migraguard diff --format json | migraguard explain

        options:
          - name: format
            description: Output format for diff results.
            valueName: fmt
            schema:
              type: string
              enum: [text, json]
              default: text

        exits:
          '0':
            description: No differences found. DB schema matches schema.sql.
            stdout:
              format: '{options.format}'

          '10':
            description: Differences found between DB schema and schema.sql.
            stdout:
              format: '{options.format}'

          '1':
            description: Unexpected error (connection error, schema.sql not found).
            stderr:
              format: text

        x-agent:
          riskLevel: low
          requiresConfirmation: false
          idempotent: true
          sideEffects:
            - database_read
          sideEffectNote: >-
            Reads DB schema via pg_dump/mysqldump and compares with
            saved schema.sql. No writes.
          expectedDurationMs: 10000
          retryableExitCodes: [1]

      # ── status ───────────────────────────────────────
      status:
        summary: Show migration status (applied / pending / failed / skipped).
        description: >-
          Queries the schema_migrations table and cross-references with
          migration files on disk to display the status of each migration.
        usage:
          - migraguard status
          - migraguard status --format json

        options:
          - name: format
            description: Output format for status results.
            valueName: fmt
            schema:
              type: string
              enum: [text, json]
              default: text

        exits:
          '0':
            description: Status displayed successfully.
            stdout:
              format: '{options.format}'

          '1':
            description: Failed to retrieve status (connection error).
            stderr:
              format: text

        x-agent:
          riskLevel: low
          requiresConfirmation: false
          idempotent: true
          sideEffects:
            - database_read
          sideEffectNote: Reads schema_migrations table and compares with local files.
          expectedDurationMs: 5000
          retryableExitCodes: [1]

      # ── resolve ──────────────────────────────────────
      resolve:
        summary: Mark a failed migration as skipped (requires human judgment).
        description: >-
          Records a 'skipped' entry in schema_migrations for the specified
          failed migration file. This unblocks subsequent migrations but
          requires explicit human judgment that the failure has been
          addressed by other means.
        usage:
          - migraguard resolve 20260301_120000__create_users_table.sql
          - migraguard resolve --dry-run 20260301_120000__create_users_table.sql

        arguments:
          - name: file
            index: 0
            required: true
            description: Failed migration file name to resolve.
            schema:
              type: string

        options:
          - name: dry-run
            aliases: [n]
            description: Show what would be resolved without writing to DB.
            schema:
              type: boolean
              default: false

        exits:
          '0':
            description: Migration marked as skipped.
            stdout:
              format: text

          '1':
            description: Resolve failed (file not found or not in failed state).
            stderr:
              format: text

        x-agent:
          riskLevel: high
          requiresConfirmation: true
          idempotent: false
          reversible: false
          rollbackGuidance: >-
            A resolved (skipped) migration cannot be un-resolved.
            Re-apply the migration manually if needed.
          sideEffects:
            - database_write
          sideEffectNote: Inserts a 'skipped' record into schema_migrations for the given file.
          safeDryRunOption: dry-run
          expectedDurationMs: 3000
          retryableExitCodes: [1]
          recommendedBeforeUse:
            - Verify that the failure has been addressed by a subsequent migration or manual fix.
            - Run migraguard status to confirm the file is in failed state.

      # ── editable ─────────────────────────────────────
      editable:
        summary: List migration files that are currently editable.
        description: >-
          Shows which migration files can be safely modified. In linear mode,
          only the tail file is editable. In DAG mode, all leaf nodes are editable.
        usage:
          - migraguard editable

        exits:
          '0':
            description: Editable files listed.
            stdout:
              format: text

          '1':
            description: Failed to determine editable files.
            stderr:
              format: text

        x-agent:
          riskLevel: low
          requiresConfirmation: false
          idempotent: true
          sideEffects: []
          sideEffectNote: Read-only. Lists leaf/latest migration files from metadata.
          expectedDurationMs: 1000
          retryableExitCodes: []

      # ── verify ───────────────────────────────────────
      verify:
        summary: Verify migration idempotency using a shadow DB.
        description: >-
          Creates a temporary shadow database, applies migrations twice,
          and confirms no errors or schema differences occur. Proves that
          migrations are safely re-executable. The shadow DB is dropped
          after verification.
        usage:
          - migraguard verify
          - migraguard verify --all
          - migraguard verify --format json

        options:
          - name: all
            description: Verify all migrations from scratch, not only pending.
            schema:
              type: boolean
              default: false

          - name: format
            description: Output format for verification results.
            valueName: fmt
            schema:
              type: string
              enum: [text, json]
              default: text

        exits:
          '0':
            description: All migrations verified as idempotent.
            stdout:
              format: '{options.format}'

          '1':
            description: Unexpected error (connection error, file parse failure).
            stderr:
              format: text

          '10':
            description: One or more migrations failed idempotency verification.
            stdout:
              format: '{options.format}'
            stderr:
              format: text

        x-agent:
          riskLevel: medium
          requiresConfirmation: false
          idempotent: true
          sideEffects:
            - database_read
            - database_write
          sideEffectNote: >-
            Creates and destroys a temporary shadow database to verify
            idempotency. Does not modify the primary database.
          expectedDurationMs: 60000
          retryableExitCodes: [1]
          recommendedBeforeUse:
            - Ensure the database server is running and accessible.

      # ── group-status ─────────────────────────────────
      group-status:
        path: [group-status]
        summary: Show migration group state (expand/contract phases).
        description: >-
          Displays the current phase state of migration groups. When a
          group name is specified, shows detailed state for that group.
          Without arguments, shows all groups.
        usage:
          - migraguard group-status
          - migraguard group-status rename_username_to_handle

        arguments:
          - name: group
            index: 0
            required: false
            description: Specific group name. Shows all groups if omitted.
            schema:
              type: string

        exits:
          '0':
            description: Group status displayed.
            stdout:
              format: text

          '1':
            description: Failed to retrieve group status.
            stderr:
              format: text

        x-agent:
          riskLevel: low
          requiresConfirmation: false
          idempotent: true
          sideEffects: []
          sideEffectNote: Read-only. Derives group state from schema_migrations records.
          expectedDurationMs: 3000
          retryableExitCodes: [1]

      # ── baseline ─────────────────────────────────────
      baseline:
        summary: Squash applied migrations into schema.sql baseline.
        description: >-
          Consolidates all applied migrations into schema.sql and
          removes the original files. Optionally keeps migration files
          from a specified point forward using --keep-since.
        usage:
          - migraguard baseline
          - migraguard baseline --keep-since 20260301_120000__create_users_table.sql
          - migraguard baseline --dry-run

        options:
          - name: keep-since
            description: Keep migration files from this point forward.
            valueName: file
            repeatable: true
            schema:
              type: string

          - name: dry-run
            aliases: [n]
            description: Show what would be baselined without writing files.
            schema:
              type: boolean
              default: false

        exits:
          '0':
            description: Baseline created successfully (or dry-run preview completed).
            stdout:
              format: text

          '1':
            description: Baseline failed.
            stderr:
              format: text

        x-agent:
          riskLevel: high
          requiresConfirmation: true
          idempotent: false
          reversible: false
          rollbackGuidance: >-
            Deleted migration files can only be recovered from version control.
            The baseline operation cannot be undone programmatically.
          sideEffects:
            - file_write
            - file_delete
          sideEffectNote: >-
            Dumps current DB schema to schema.sql, deletes squashed migration
            files, updates metadata.json, and rewrites depends-on references.
          safeDryRunOption: dry-run
          expectedDurationMs: 30000
          retryableExitCodes: []
          recommendedBeforeUse:
            - Ensure all migrations have been applied to all environments.
            - Back up migration files before running.

      # ── advance ──────────────────────────────────────
      advance:
        summary: Record a phase state transition (for external executor).
        description: >-
          Updates the state of a migration group phase. Used by external
          executors to record phase transitions in the expand/contract workflow.
          Valid phases: expand, backfill, switch, contract.
          Valid statuses: running, completed, failed.
        usage:
          - migraguard advance rename_username_to_handle expand completed
          - migraguard advance rename_username_to_handle backfill running

        arguments:
          - name: group
            index: 0
            required: true
            description: Migration group name.
            schema:
              type: string

          - name: phase
            index: 1
            required: true
            description: Phase to advance.
            schema:
              type: string
              enum: [expand, backfill, switch, contract]

          - name: status
            index: 2
            required: true
            description: New status for the phase.
            schema:
              type: string
              enum: [running, completed, failed]

        options:
          - name: tag
            description: Tag to record (e.g. commit hash, release tag).
            schema:
              type: string

          - name: dry-run
            aliases: [n]
            description: Show what would be recorded without writing to DB.
            schema:
              type: boolean
              default: false

        exits:
          '0':
            description: Phase state transition recorded (or dry-run preview completed).
            stdout:
              format: text

          '1':
            description: >-
              Advance failed (invalid phase/status, group not found,
              or invalid state transition).
            stderr:
              format: text

        x-agent:
          riskLevel: medium
          requiresConfirmation: true
          idempotent: false
          reversible: false
          rollbackGuidance: >-
            State transitions cannot be undone. Use advance with the previous
            status value to manually correct, or reset group state in the database.
          sideEffects:
            - database_write
          sideEffectNote: Inserts a phase state transition record into schema_migrations.
          safeDryRunOption: dry-run
          expectedDurationMs: 5000
          retryableExitCodes: [1]
          recommendedBeforeUse:
            - Run migraguard group-status <group> to verify current phase state before advancing.

      # ── apply-phase ──────────────────────────────────
      apply-phase:
        path: [apply-phase]
        summary: Apply a specific phase of a migration group via native CLI.
        description: >-
          Executes the SQL file for a specific phase of a migration group
          using the database's native CLI (psql, mysql, or sqlite3).
          Valid phases: expand, backfill, switch, contract.
        usage:
          - migraguard apply-phase rename_username_to_handle expand
          - migraguard apply-phase rename_username_to_handle contract

        arguments:
          - name: group
            index: 0
            required: true
            description: Migration group name.
            schema:
              type: string

          - name: phase
            index: 1
            required: true
            description: Phase to apply.
            schema:
              type: string
              enum: [expand, backfill, switch, contract]

        options:
          - name: tag
            description: Tag to record (e.g. commit hash, release tag).
            schema:
              type: string

          - name: dry-run
            aliases: [n]
            description: Show what would be applied without executing SQL.
            schema:
              type: boolean
              default: false

        exits:
          '0':
            description: Phase applied successfully (or dry-run preview completed).
            stdout:
              format: text

          '1':
            description: >-
              Phase apply failed (SQL error, group not found,
              or invalid phase for current state).
            stderr:
              format: text

        x-agent:
          riskLevel: high
          requiresConfirmation: true
          idempotent: false
          reversible: false
          rollbackGuidance: >-
            Phase execution is not automatically reversible. Write a compensating
            migration or restore from backup if rollback is needed.
          sideEffects:
            - database_write
          sideEffectNote: >-
            Executes a phase SQL file via native CLI and records the
            result in schema_migrations. Uses advisory lock.
          safeDryRunOption: dry-run
          expectedDurationMs: 30000
          retryableExitCodes: []
          recommendedBeforeUse:
            - Run migraguard group-status to verify current phase state.

      # ── gate ─────────────────────────────────────────
      gate:
        summary: Evaluate deployment gate conditions against migration group states.
        description: >-
          Checks whether the current migration group states satisfy
          the specified deployment gate conditions. Used in CI/CD pipelines
          to gate deployments on schema state. Conditions use the syntax
          "group:<name>.<condition>" where condition is one of:
          expand_applied, backfill_applied, switch_applied, contract_applied,
          expand_pending, backfill_pending, switch_pending, contract_pending.
        usage:
          - 'migraguard gate --require "group:rename_username_to_handle.expand_applied"'
          - 'migraguard gate --forbid "group:rename_username_to_handle.contract_pending"'
          - migraguard gate --contract-file deploy-gates.json

        options:
          - name: require
            description: >-
              Required schema state conditions.
              Syntax: group:<name>.<condition>
            valueName: condition
            repeatable: true
            schema:
              type: string
              pattern: '^group:[a-z_]+\.(expand|backfill|switch|contract)_(applied|pending)$'

          - name: forbid
            description: >-
              Forbidden schema state conditions.
              Syntax: group:<name>.<condition>
            valueName: condition
            repeatable: true
            schema:
              type: string
              pattern: '^group:[a-z_]+\.(expand|backfill|switch|contract)_(applied|pending)$'

          - name: contract-file
            description: JSON file with schema requirements.
            valueName: path
            schema:
              type: string
            file:
              mode: read
              exists: true
              mediaType: application/json
              encoding: utf-8

        exits:
          '0':
            description: All gate conditions satisfied.
            stdout:
              format: text

          '1':
            description: Unexpected error (connection error, invalid condition syntax).
            stderr:
              format: text

          '10':
            description: One or more gate conditions not satisfied.
            stderr:
              format: text

        x-agent:
          riskLevel: low
          requiresConfirmation: false
          idempotent: true
          sideEffects: []
          sideEffectNote: Read-only. Evaluates gate conditions against schema_migrations state.
          expectedDurationMs: 5000
          retryableExitCodes: [1]

      # ── deps ─────────────────────────────────────────
      deps:
        summary: Analyze and display migration dependency graph.
        description: >-
          Parses migration SQL files to extract object creation/reference
          relationships and builds a dependency graph. In DAG mode, shows
          the full dependency tree. Optionally outputs as an interactive
          HTML visualization.
        usage:
          - migraguard deps
          - migraguard deps --html deps.html

        options:
          - name: html
            description: >-
              Output as HTML file with interactive visualization.
              File is created or overwritten at the specified path.
              Parent directory must exist.
            valueName: path
            schema:
              type: string

        exits:
          '0':
            description: Dependency graph displayed or HTML file generated.
            stdout:
              format: text
            files:
              - path: '{options.html}'
                required: false
                mediaType: text/html
                encoding: utf-8
                description: HTML dependency visualization (when --html specified).

          '1':
            description: Dependency analysis failed.
            stderr:
              format: text

        x-agent:
          riskLevel: low
          requiresConfirmation: false
          idempotent: true
          sideEffects:
            - file_write
          sideEffectNote: >-
            Reads migration files and outputs dependency graph.
            Writes HTML file only when --html is specified.
          expectedDurationMs: 3000
          retryableExitCodes: []

      # ── audit ─────────────────────────────────────────
      audit:
        summary: Run LLM-based migration safety audit.
        description: >-
          Performs semantic analysis of migration SQL using LLM to identify
          operational risks that AST-based lint cannot detect. Checks lock risks,
          expand/contract necessity, backfill safety, deployment ordering,
          and allow-directive validity. Requires agent-contracts-runtime as
          an optional peer dependency.
        usage:
          - migraguard audit db/migrations/20260510_120000__add_user_status.sql
          - migraguard audit db/migrations/
          - migraguard audit --adapter gemini --dry-run

        arguments:
          - name: target
            index: 0
            required: false
            description: >-
              Migration file or directory to audit.
              Defaults to pending migrations.
            schema:
              type: string

        options:
          - name: adapter
            aliases: [a]
            description: SDK adapter to use for LLM execution.
            valueName: name
            schema:
              type: string
              enum: [cursor, claude, openai, gemini, mock]

          - name: model
            description: LLM model override.
            valueName: name
            schema:
              type: string

          - name: dry-run
            aliases: [n]
            description: Output the constructed prompt without calling LLM.
            schema:
              type: boolean
              default: false

          - name: fail-on
            description: Minimum severity that causes a non-zero exit.
            valueName: level
            schema:
              type: string
              enum: [warning, error, critical]
              default: error

          - name: output
            aliases: [o]
            description: Write result to a file instead of stdout.
            valueName: file
            schema:
              type: string
            file:
              mode: write
              mediaType: application/json
              encoding: utf-8

          - name: report-format
            description: Output format for the audit report.
            valueName: fmt
            schema:
              type: string
              enum: [json, text, yaml]
              default: json

        exits:
          '0':
            description: Audit completed, no blocking findings.
            stdout:
              format: '{options.report-format}'
              schema:
                $ref: '#/components/schemas/MigrationAuditResult'

          '1':
            description: Unexpected error.
            stderr:
              format: text

          '2':
            description: Configuration or input error.
            stderr:
              format: text

          '10':
            description: Completed with blocking findings.
            stdout:
              format: '{options.report-format}'
              schema:
                $ref: '#/components/schemas/MigrationAuditResult'

          '11':
            description: Runtime dependency missing (agent-contracts-runtime).
            stderr:
              format: text

          '12':
            description: LLM provider or adapter error.
            stderr:
              format: text

        x-agent:
          riskLevel: low
          requiresConfirmation: false
          idempotent: true
          sideEffects: [network]
          sideEffectNote: >-
            Network calls to LLM provider when adapter is not mock.
            Filesystem write only when --output is specified.
          safeDryRunOption: dry-run
          expectedDurationMs: 120000
          retryableExitCodes: [12]

      # ── propose-expand-contract ───────────────────────
      propose-expand-contract:
        path: [propose-expand-contract]
        summary: Propose expand/contract migration group from unsafe DDL.
        description: >-
          Analyzes a migration file containing potentially unsafe DDL
          (renames, type changes, drops) and proposes a phased
          expand/contract migration group with SQL for each phase.
          Requires agent-contracts-runtime.
        usage:
          - migraguard propose-expand-contract db/migrations/20260510__rename_username.sql
          - migraguard propose-expand-contract --output-dir ./proposed/ --dry-run

        arguments:
          - name: file
            index: 0
            required: true
            description: Migration file to decompose into expand/contract phases.
            schema:
              type: string
            file:
              mode: read
              exists: true
              mediaType: application/sql
              encoding: utf-8

        options:
          - name: output-dir
            description: Directory to write proposed phase files.
            valueName: dir
            schema:
              type: string

          - name: adapter
            aliases: [a]
            description: SDK adapter to use.
            valueName: name
            schema:
              type: string
              enum: [cursor, claude, openai, gemini, mock]

          - name: model
            description: LLM model override.
            valueName: name
            schema:
              type: string

          - name: dry-run
            aliases: [n]
            description: Output the prompt without calling LLM.
            schema:
              type: boolean
              default: false

          - name: fail-on
            description: Minimum severity that causes a non-zero exit.
            valueName: level
            schema:
              type: string
              enum: [warning, error, critical]
              default: error

          - name: output
            aliases: [o]
            description: Write result to a file instead of stdout.
            valueName: file
            schema:
              type: string
            file:
              mode: write
              mediaType: application/json
              encoding: utf-8

          - name: report-format
            description: Output format for the proposal report.
            valueName: fmt
            schema:
              type: string
              enum: [json, text, yaml]
              default: json

        exits:
          '0':
            description: Proposal generated successfully.
            stdout:
              format: '{options.report-format}'
              schema:
                $ref: '#/components/schemas/ExpandContractProposal'

          '1':
            description: Unexpected error.
            stderr:
              format: text

          '2':
            description: Configuration or input error (file not found, invalid SQL).
            stderr:
              format: text

          '10':
            description: Completed with blocking findings.
            stdout:
              format: '{options.report-format}'
              schema:
                $ref: '#/components/schemas/ExpandContractProposal'

          '11':
            description: Runtime dependency missing (agent-contracts-runtime).
            stderr:
              format: text

          '12':
            description: LLM provider or adapter error.
            stderr:
              format: text

        x-agent:
          riskLevel: low
          requiresConfirmation: false
          idempotent: true
          sideEffects: [network, file_write]
          sideEffectNote: >-
            Network calls to LLM provider when adapter is not mock.
            Filesystem write when --output or --output-dir is specified.
          safeDryRunOption: dry-run
          expectedDurationMs: 120000
          retryableExitCodes: [12]

      # ── explain ───────────────────────────────────────
      explain:
        summary: Explain command output in human-readable form using LLM.
        description: >-
          Reads JSON output from another migraguard command via stdin
          and generates a human-readable explanation suitable for PR
          comments, release decisions, or incident communication.
          Requires agent-contracts-runtime.
        usage:
          - migraguard lint --format json | migraguard explain
          - migraguard diff --format json | migraguard explain
          - migraguard verify --format json | migraguard explain

        stdin:
          format: json
          description: >-
            JSON output from a migraguard command (lint, diff, status, verify).
            Must be valid JSON. Empty stdin or TTY input results in exit code 2.
          encoding: utf-8

        options:
          - name: adapter
            aliases: [a]
            description: SDK adapter to use.
            valueName: name
            schema:
              type: string
              enum: [cursor, claude, openai, gemini, mock]

          - name: model
            description: LLM model override.
            valueName: name
            schema:
              type: string

          - name: dry-run
            aliases: [n]
            description: Output the prompt without calling LLM.
            schema:
              type: boolean
              default: false

          - name: fail-on
            description: Minimum severity that causes a non-zero exit.
            valueName: level
            schema:
              type: string
              enum: [warning, error, critical]
              default: error

          - name: output
            aliases: [o]
            description: Write result to a file instead of stdout.
            valueName: file
            schema:
              type: string
            file:
              mode: write
              mediaType: application/json
              encoding: utf-8

          - name: report-format
            description: Output format for the explanation report.
            valueName: fmt
            schema:
              type: string
              enum: [json, text, yaml]
              default: json

        exits:
          '0':
            description: Explanation generated.
            stdout:
              format: '{options.report-format}'
              schema:
                $ref: '#/components/schemas/ExplainResult'

          '1':
            description: Unexpected error.
            stderr:
              format: text

          '2':
            description: Invalid input or no stdin data (empty pipe, malformed JSON, TTY).
            stderr:
              format: text

          '10':
            description: Completed with blocking findings.
            stdout:
              format: '{options.report-format}'
              schema:
                $ref: '#/components/schemas/ExplainResult'

          '11':
            description: Runtime dependency missing (agent-contracts-runtime).
            stderr:
              format: text

          '12':
            description: LLM provider or adapter error.
            stderr:
              format: text

        x-agent:
          riskLevel: low
          requiresConfirmation: false
          idempotent: true
          sideEffects: [network]
          sideEffectNote: >-
            Network calls to LLM provider when adapter is not mock.
            Filesystem write only when --output is specified.
          safeDryRunOption: dry-run
          expectedDurationMs: 120000
          retryableExitCodes: [12]

components:
  schemas:
    # ── AI Agent Interoperability Schemas (SSoT) ─────────

    # Conforms to agent-contracts dsl_base/components.yaml#/schemas/agent-evidence.
    # Canonical property names are kind/target/location/excerpt (NOT type/content/source).
    AgentEvidence:
      type: object
      description: Evidence supporting an agent finding.
      required: [kind]
      properties:
        kind:
          type: string
          enum: [file, command, schema, diff, stdout, stderr, text]
        target:
          type: string
          description: Target identifier (file path, command ID, schema name).
        location:
          type: string
          description: Location within the target (line number, JSON pointer).
        excerpt:
          type: string
          description: Relevant excerpt from the target.

    AgentFinding:
      type: object
      description: A single finding from a migration audit.
      required: [severity, category, message]
      properties:
        id:
          type: string
          description: Unique finding identifier.
        severity:
          type: string
          enum: [info, warning, error, critical]
        category:
          type: string
          description: >-
            Finding category. Migration-specific categories:
            lock_risk, idempotency, expand_contract, backfill_safety,
            rollback_risk, deploy_order, allow_directive.
        target:
          type: string
          description: Target of the finding (file path, SQL statement).
        location:
          type: string
          description: Location within the target.
        message:
          type: string
        recommendation:
          type: string
        confidence:
          type: number
          minimum: 0
          maximum: 1
          description: Confidence score (0-1) for LLM-generated findings.
        evidence:
          type: array
          items:
            $ref: '#/components/schemas/AgentEvidence'
        details:
          type: object
          additionalProperties: true

    AgentRecommendedAction:
      type: object
      description: A recommended action from a migration audit.
      required: [kind, title]
      properties:
        kind:
          type: string
          enum: [run_command, edit_file, review, confirm, block, ignore]
        title:
          type: string
        command:
          type: string
          description: CLI command to run (for run_command kind).
        target:
          type: string
          description: Target file or resource.
        rationale:
          type: string

    MigrationAuditResult:
      type: object
      description: >-
        Top-level result from a migration safety audit.
        Conforms to cli-contracts AgentAuditResult reference schema.
      required: [summary, riskLevel, findings]
      properties:
        summary:
          type: string
        riskLevel:
          type: string
          enum: [low, medium, high, critical]
        findings:
          type: array
          items:
            $ref: '#/components/schemas/AgentFinding'
        recommendedActions:
          type: array
          items:
            $ref: '#/components/schemas/AgentRecommendedAction'
        metadata:
          type: object
          properties:
            tool:
              type: string
            command:
              type: string
            version:
              type: string
            generatedAt:
              type: string
            adapter:
              type: string
            model:
              type: string

    ExpandContractProposal:
      type: object
      description: >-
        Result from propose-expand-contract command. Contains the proposed
        phased migration group with SQL for each phase.
      required: [summary, riskLevel, findings, phases]
      properties:
        summary:
          type: string
          description: Overview of the proposed decomposition.
        riskLevel:
          type: string
          enum: [low, medium, high, critical]
          description: Risk level of the original unsafe DDL.
        findings:
          type: array
          items:
            $ref: '#/components/schemas/AgentFinding'
          description: Issues found in the original migration.
        phases:
          type: array
          items:
            type: object
            required: [name, sql, description]
            properties:
              name:
                type: string
                enum: [expand, backfill, switch, contract]
              sql:
                type: string
                description: SQL content for this phase.
              description:
                type: string
                description: Human-readable description of what this phase does.
              deploymentGate:
                type: string
                description: Gate condition to verify before proceeding to next phase.
          description: Ordered list of migration phases.
        recommendedActions:
          type: array
          items:
            $ref: '#/components/schemas/AgentRecommendedAction'
        metadata:
          type: object
          properties:
            tool:
              type: string
            command:
              type: string
            version:
              type: string
            generatedAt:
              type: string
            adapter:
              type: string
            model:
              type: string

    ExplainResult:
      type: object
      description: >-
        Result from explain command. Contains a human-readable explanation
        of another command's output, suitable for PR comments or release decisions.
      required: [summary, riskLevel, findings, explanation]
      properties:
        summary:
          type: string
          description: One-line summary for quick scanning.
        riskLevel:
          type: string
          enum: [low, medium, high, critical]
          description: Assessed urgency of the underlying issue.
        explanation:
          type: string
          description: >-
            Multi-paragraph human-readable explanation in Markdown format.
            Written for non-DBA audiences.
        findings:
          type: array
          items:
            $ref: '#/components/schemas/AgentFinding'
          description: Key points extracted from the command output.
        recommendedActions:
          type: array
          items:
            $ref: '#/components/schemas/AgentRecommendedAction'
          description: Concrete next steps for the reader.
        sourceCommand:
          type: string
          description: The command that produced the input (e.g. "migraguard lint").
        metadata:
          type: object
          properties:
            tool:
              type: string
            command:
              type: string
            version:
              type: string
            generatedAt:
              type: string
            adapter:
              type: string
            model:
              type: string
